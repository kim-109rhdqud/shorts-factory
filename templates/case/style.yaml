# 판례 썰: 실제 판결문(저작권법 제7조, 보호받지 않는 저작물)을 당사자 시점 사연으로 재구성 → 마지막에 판결 공개
name: 판례 썰
segmented: true
labels: ["판결"]          # 판결 구간에만 위쪽에 "판결" 표시
min_chars: 380            # 공백 제외 (+30% 속도에서 약 1분 10~25초). 길면 주저리주저리 (사용자 피드백)
max_chars: 500
segment_pause: 0.6        # 사연 → 판결 넘어갈 때 잠깐 뜸
extra_keys: [header, narrator]
agy_model: gemini-3.1-pro-high
voices:                   # 3인칭 해설이라 남성 해설 목소리 고정 (narrator: male)
  female: ko-KR-InJoonNeural
  male: ko-KR-InJoonNeural
min_year: 2005
keywords: [층간소음, 주차, 결혼식, 중고거래, 반려견, 임대차보증금, 택배, 환불, 이웃, 누수, 예식장, 헬스장, 학원비, 축의금, 위자료 이웃, 애완견, 공동주택 소음, 숙박 예약 취소]
disclaimer: "※ 실제 판결({court} {case_no})을 바탕으로 재구성한 이야기입니다. 대사와 세부 묘사는 각색되었으며, 등장인물은 가명입니다."
review_notes: |
  - 이 스타일은 실제 판결을 3인칭으로 해설하는 대본이다. 원자료와 다른 사실(누가, 언제, 무엇을, 청구 금액, 각 심급 판단, 결과·금액)이 있으면 반드시 원자료대로 고친다.
  - 원자료에 없는 사건·인물·대사·숫자를 지어내지 않았는지 본다.
  - 말투 기준을 지킨다: 3인칭, 짧은 문장(평균 30자 안팎), "~습니다" 절반 이상 + "~죠/~거든요/~고요" 섞기, "~해요" 금지, 질문은 반론 질문 하나만, 과장 표현과 "여러분" 금지, 숫자는 많이.
  - 첫 두 문장(상황 + 반전 훅)과 구조, 판결 공개 위치는 바꾸지 않는다. 사실 오류만 최소한으로 고친다.
  - 판결문에 없는 마무리 묘사(예: '남은 건 가구뿐')는 판결문에 있는 사실로 바꾼다.
  - 같은 사실을 두 번 말하면 한 번만 남긴다 (예: "5주"가 두 번, "비행기 값만"이 두 번).
  - 원자료(사실 목록)와 표현이 다른 사실은 목록 표현으로 되돌린다 (예: "고령 및 개인 일정"을 "건강"으로 바꾼 것).
  - 어려운 법률 용어는 쉬운 말로 (수인한도 → 참고 지낼 수 있는 정도, 불법행위 → 잘못, 원고/피고 → 역할 이름).
  - 반론 질문이 어색하면 "~지 않냐고요?" 형태의 자연스러운 반론으로 다듬는다.
  - 주소, 아파트 이름, 실명 같은 개인 정보가 없게 한다.
  - fact_check에는 판결 결과와 금액, 날짜, 사건번호를 넣는다.
style_checks:             # AI 티 자동 검사 (70만 해설 채널 대본 분석 기준, 2026-10-08)
  max_avg_sentence: 36    # 문장 평균 글자 수
  max_questions: 2        # 물음표 문장 수
  min_numbers_per_1000: 3 # 1000자당 숫자 개수 (너무 많으면 보고서처럼 들려서 낮춤)
  min_formal_ratio: 0.4   # "~니다"로 끝나는 문장 비율
  max_haeyo_ratio: 0.12   # "~해요/~예요/~어요" 끝 비율
  max_first_sentence: 35  # 첫 문장 글자 수 (상황 하나만)
  jargon: [수인한도, 불법행위, 원상회복, 상당인과관계, 청구취지, 인용했, 피고, 원고, 항변, 가집행, 지연손해금, 약관규제법, 기망, 과실상계, 채무불이행, 사용수익권, 손익상계, 파기환송, 법리]
  banned_words: [충격, 역대급, 경악, 소름, 파격, 냉혹, 미쳤, 기막힌, 통쾌, 무려, 과연, 대망의, 놀랍게도, 여러분, 참으로, 혹독, 씁쓸, 안타깝, 허무, 씁쓸한]
layout:
  header: {font_size: 66, position_y: 0.13, color: "#FFFFFF", box_color: "#000000", box_alpha: 0.55, margin: 70}
  label: {font_size: 150, position_y: 0.27, color: "#FFE400", outline: 10}
  item: {font_size: 78, position_y: 0.355, color: "#FFFFFF", outline: 8}
