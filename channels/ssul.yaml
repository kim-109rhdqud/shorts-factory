name: 오늘의 썰              # 가칭
active: true
styles: [case]                 # 2026-10-08 판례만 (사용자 결정). AI 썰(story)은 중지
language: ko
voices:                          # 화자 성별 → 목소리 (썰 스타일)
  female: ko-KR-SunHiNeural
  male: ko-KR-InJoonNeural
speech_rate: "+30%"
voice_pitch: "-4Hz"              # 다른 채널과 구분되게 살짝 낮은 톤
daily_count: 1                   # 2026-10-10 Flow 전환으로 하루 1편
priority: 1                      # 숫자가 작을수록 먼저 제작 (구글 한도를 썰 채널이 먼저 쓰게)
music_pools: [km_calm]            # 2026-10-08 새 선곡
subtitle:
  highlight_color: "#FF7EB6"     # 분홍
youtube_channel_id: ""
banned_topics: []
scene_images:                    # 장면마다 AI 그림 (Antigravity 이미지 생성, 구독 범위)
  enabled: true
  max_scenes: 6                  # Flow 장면 6개 (B안: 10초 × 6 = 90 크레딧)
  required: true
  art_style: "Korean webtoon illustration, clean line art, soft cel shading, warm muted colors, cinematic composition"
flow:                            # 장면마다 Flow 영상 (사용자가 Flow에서 직접 생성, 2026-10-10 결정)
  enabled: true
  clip_seconds: 10               # Omni 1.1 Flash 10초 = 15 크레딧
  setting: "Omni 1.1 Flash · 10초 · 세로(9:16)"
  style_suffix: "Korean webtoon illustration style, same characters as the input image, smooth subtle motion, vertical 9:16, no text, no logos"
