name: 오늘의 썰              # 가칭
active: true
styles: [case]                 # 2026-10-08 판례만 (사용자 결정). AI 썰(story)은 중지
language: ko
voices:                          # 화자 성별 → 목소리 (썰 스타일)
  female: ko-KR-SunHiNeural
  male: ko-KR-InJoonNeural
speech_rate: "+30%"
