# shorts-factory 공통 설정
# 경로는 프로젝트 폴더 기준 상대 경로

tools:                 # 외부 프로그램 실행 파일 (PATH에 있으면 이름만)
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  rclone: rclone
  agy: ~/.local/bin/agy
  claude: claude

paths:
  output: output
  work: output/_work   # 중간 파일 (음성, 자막 등)

drive:
  remote: "gdrive:shorts-factory"   # rclone 리모트:드라이브 폴더

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 23              # 화질 (낮을수록 고화질·큰 파일)
  preset: veryfast     # 인코딩 속도
  threads: 2           # 서버 CPU 2코어

voice:                 # 채널 설정이 없을 때 기본값
  name: ko-KR-InJoonNeural
  rate: "+35%"

subtitle:
  font_dir: assets/fonts
  font_name: Pretendard ExtraBold
  font_size: 118
  outline: 9
  highlight_color: "#FFE400"   # 지금 읽는 단어 강조색 (노랑)
  position_y: 0.62     # 자막 세로 위치 (0=맨 위, 1=맨 아래)
  max_chars: 12        # 한 화면 자막 최대 글자 수
  max_words: 3         # 한 화면 자막 최대 단어 수
  pause_split: 0.35    # 이 시간(초) 이상 쉬면 자막을 끊음

background:
  dir: assets/backgrounds
  pool: nature                # 기본 배경 풀 (채널 설정이 생기면 채널별로)
  segment_sec: [3.5, 6.0]     # 클립 하나를 보여주는 길이 (초, 최소~최대)
  brightness: -0.12           # 자막이 잘 보이게 살짝 어둡게
  saturation: 1.1
  colors: ["0x1e3c72", "0x2a5298", "0x6a3093"]   # 클립이 없을 때 그라데이션 색

music:
  pool: bright                # 기본 음악 풀 (assets/music 아래 폴더)
  volume: 0.22                # 음악 기본 크기 (목소리 대비)
  duck_threshold: 0.03        # 목소리가 이보다 크면 음악을 줄임
  duck_ratio: 6
  fade_in: 1.0
  fade_out: 1.5

llm:
  providers: [agy, claude]   # 앞에서부터 시도 (Antigravity 주력, Claude 예비)
  agy_model: ""              # 비우면 기본 모델 (agy models 로 목록 확인)
  claude_model: sonnet
  timeout_sec: 240
  retries: 2                 # 프로그램마다 재시도 횟수
  min_interval_sec: 5        # 호출 사이 최소 간격
  daily_limit: {agy: 40, claude: 10}
  sandbox: ~/.local/share/shorts-factory/llm_sandbox  # AI가 실행되는 빈 폴더 (프로젝트 밖: CLAUDE.md 등을 읽지 않게)
  usage_file: data/llm_usage.json

script:
  template_dir: templates
  max_attempts: 3            # 검사 통과 못 하면 다시 요청하는 횟수
  review: true               # 두 번째 호출로 사실 확인·상투 표현 다듬기
  banned_topics: [정치, 종교, 의료정보, 투자 권유, 성인, 혐오, 실존 인물 비방]

cleanup:
  keep_days: 14              # 서버에서 이 날짜보다 오래된 영상 폴더 삭제 (드라이브에 있을 때만)

images:
  daily_limit: 10            # 하루 AI 그림 상한. 구독 한도가 하루 10장 남짓 (2026-10-07 13장째에 429 오류) → 썰 하루 2개 × 4장
  timeout_sec: 1500          # 그림 한 묶음 생성 최대 대기
  usage_file: data/image_usage.json
